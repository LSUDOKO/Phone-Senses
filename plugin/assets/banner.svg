  <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="1.4">
    <line x1="600" y1="458" x2="600" y2="486"/><line x1="586" y1="472" x2="614" y2="472"/>
    <line x1="590" y1="462" x2="610" y2="482"/><line x1="610" y1="462" x2="590" y2="482"/>
