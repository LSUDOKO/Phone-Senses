name: Bug report
description: Something in Phone Senses (plugin or phone helper) does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **This issue is public.** Before you paste anything, remove
        phone numbers, contact names, message text, OTP codes, bank account digits, locations and
        your pairing code. Replace them with placeholders like `+91 9000000xxx` or `<redacted>`.

        Found a security problem (auth bypass, approval bypass, OTP leak, data leaving the device)?
        Do **not** open an issue. Follow [SECURITY.md](https://github.com/LSUDOKO/Phone-Senses/blob/main/SECURITY.md).
  - type: input
    id: hermes-version
    attributes:
      label: Hermes Agent version
      description: Output of `hermes --version`.
      placeholder: "0.23.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model and Android version
      placeholder: "moto g34 5G, Android 15"
    validations:
      required: true
  - type: input
    id: termux-api
    attributes:
      label: Termux and Termux:API versions
      description: From F-Droid or Android settings > Apps. Say if you installed from the Play Store.
      placeholder: "Termux 0.118.x, Termux:API 0.50.x (F-Droid)"
    validations:
      required: true
  - type: dropdown
    id: helper-mode
    attributes:
      label: Helper mode
      options:
        - Real phone
        - Mock helper (--mock)
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool or command
      description: Which tool or slash command misbehaved.
      placeholder: "phone_money_summary, /phone brief, ..."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you asked, what you expected, and what Hermes or the tool returned instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the helper with ...
        2. Ask Hermes "..."
        3. ...
  - type: textarea
    id: helper-log
    attributes:
      label: Helper log lines
      description: |
        The lines the helper printed in Termux around the failure (request paths and status codes).
        **Remove phone numbers, message text and OTPs before pasting.** The helper does not log
        message bodies, but check anyway, and also check any tool output you paste.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed phone numbers, names, message text, OTPs, account digits and my pairing code from this report.
          required: true
